
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Estudiantes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Gestión de Estudiantes</h1>
        <p>Administra la información de tus estudiantes</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Registrar estudiante</h2>

            <form id="studentForm">
                <input type="text" id="name" placeholder="Nombre completo">
                <input type="email" id="email" placeholder="Correo electrónico">
                <input type="text" id="course" placeholder="Carrera o curso">
                <button type="submit">Registrar estudiante</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Lista de estudiantes</h2>
            <div id="studentList">
                <p>Las funcionalidades se habilitarán durante el desarrollo.</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
